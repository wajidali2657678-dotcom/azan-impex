<!-- ==========================================================================
       JAVASCRIPT ENGINE (PRESERVED BUSINESS LOGIC, NEW UI LOGIC, SECURE ADMIN)
       ========================================================================== -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw-bs-E8S-Ndd7M9QNFA7SsR3kxHxMRhILDma0u6rXZIEEnIRmwU_GSPV3-zHcgX0g5/exec";
    const OWNER_EMAIL = "wajidali2657678@gmail.com";

    // Preserved Image Pools
    const UNIQUE_SPORT_IMGS = {
      Baseball: ["https://images.unsplash.com/photo-1517649763962-0c623266010b?auto=format&fit=crop&w=800&q=80", "https://images.unsplash.com/photo-1562077772-3bd90403f7f0?auto=format&fit=crop&w=800&q=80"],
      Basketball: ["https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=800&q=80", "https://images.unsplash.com/photo-1519861531473-9200262188bf?auto=format&fit=crop&w=800&q=80"],
      Football: ["https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80", "https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=800&q=80"],
      Rugby: ["https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=800&q=80"],
      Cricket: ["https://images.unsplash.com/photo-1569517282132-25d22f4573e6?auto=format&fit=crop&w=800&q=80"],
      Volleyball: ["https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?auto=format&fit=crop&w=800&q=80"],
      Performance: ["https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=800&q=80"],
      Lifestyle: ["https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=800&q=80"]
    };

    const SPORTS_CATEGORIES = [
      { name: 'Baseball', code: 'BSB', fabric: 'Polynix Twill / Mesh', gsm: '200 GSM' },
      { name: 'Basketball', code: 'BKB', fabric: 'Dazzle Mesh', gsm: '170 GSM' },
      { name: 'Football', code: 'SOC', fabric: 'Micro Interlock', gsm: '140 GSM' },
      { name: 'Rugby', code: 'RGB', fabric: 'THT-952 Reinforced', gsm: '310 GSM' },
      { name: 'Cricket', code: 'CRK', fabric: 'Micro Speedo Cricket', gsm: '220 GSM' },
      { name: 'Volleyball', code: 'VLB', fabric: 'Micro Mesh Dull', gsm: '115 GSM' },
      { name: 'Performance', code: 'PRF', fabric: '5-Hole Mesh', gsm: '100 GSM' },
      { name: 'Lifestyle', code: 'LFS', fabric: 'Heavy Jersey', gsm: '280 GSM' }
    ];

    // Restored Google Sheet Mapping Dictionary for Garment Types
    const typeMap = {
      "TYP-JRS": "Jersey",
      "TYP-SHT": "Shorts",
      "TYP-SET": "Full Kit Set",
      "TYP-HDY": "Hoodie",
      "TYP-TRK": "Tracksuit",
      "TYP-TSH": "T-Shirt",
      "TYP-POL": "Polo Shirt",
      "TYP-TNK": "Tank Top",
      "TYP-CMP": "Compression Top",
      "TYP-JKT": "Team Jacket",
      "TYP-PNT": "Sports Pants",
      "TYP-WBK": "Windbreaker",
      "TYP-GKJ": "Goalkeeper Jersey",
      "TYP-TRN": "Training Top",
      "TYP-JGR": "Performance Joggers",
      "TYP-CYC": "Cycling Jersey",
      "TYP-RGS": "Rugby Shorts",
      "TYP-SNG": "Performance Singlet"
    };

    let PRODUCTS = [];
    let idCounter = 1;

    // Generative Fallback Database
    SPORTS_CATEGORIES.forEach(cat => {
      const imgPool = UNIQUE_SPORT_IMGS[cat.name] || UNIQUE_SPORT_IMGS.Performance;
      for (let i = 1; i <= 12; i++) {
        if (PRODUCTS.length >= 92) break;
        const skuNumber = String(i).padStart(3, '0');
        const sku = `AZ-${cat.code}-${skuNumber}`;
        const isSet = i % 3 === 0;
        const isShort = i % 4 === 0;
        
        let garmentType = 'Jersey';
        if (isShort) garmentType = 'Shorts';
        if (isSet) garmentType = 'Full Kit Set';
        if (cat.name === 'Lifestyle') garmentType = i % 2 === 0 ? 'Hoodie' : 'Tracksuit';

        PRODUCTS.push({
          id: idCounter++,
          sku: sku,
          name: `Sublimated ${cat.name} ${garmentType} ${skuNumber}`,
          sport: cat.name,
          category: cat.name,
          garmentType: garmentType,
          description: `Full dye-sublimated custom ${garmentType.toLowerCase()} engineered for ${cat.name}. Heat-bonded color fastness guaranteed against wash cracking or fading.`,
          fabric: cat.fabric,
          gsm: cat.gsm,
          sizes: 'S, M, L, XL, XXL, 3XL',
          colors: 'Unlimited Sublimation Colors',
          images: [imgPool[(i - 1) % imgPool.length], imgPool[i % imgPool.length]]
        });
      }
    });

    // 1. LIVE GOOGLE SHEET SYNC ENGINE (PRESERVED)
    async function loadLiveSheetData() {
      if (!GOOGLE_SHEET_WEBHOOK_URL.includes("script.google.com")) return;
      try {
        const response = await fetch(GOOGLE_SHEET_WEBHOOK_URL + "?action=getData");
        const sheetData = await response.json();

        // Sync Hero
        if (sheetData?.hero?.length > 0) {
          const firstHero = sheetData.hero[0];
          if(firstHero.Title) document.getElementById('heroTitle').innerHTML = firstHero.Title;
          if(firstHero.Description) document.getElementById('heroDesc').innerHTML = firstHero.Description;
          if(firstHero.ImageURL) {
            const heroWrap = document.getElementById('heroSlidesWrap');
            heroWrap.innerHTML = `<img src="${firstHero.ImageURL}" alt="Sportswear Manufacturing" style="width:100%;height:100%;object-fit:cover;opacity:0.4;">`;
          }
        }

        // Sync Products
        if (sheetData?.products?.length > 0) {
          const liveProducts = sheetData.products.map((row, idx) => {
            const sportId = String(row.SportID || row.Sport || "").trim();
            const sportName = sportId.toLowerCase().startsWith("spt-") ? sportId.replace(/^spt-/i, "") : (sportId || "Custom Sport");
            const imgPool = UNIQUE_SPORT_IMGS[sportName] || UNIQUE_SPORT_IMGS.Performance;
            
            // Restored GarmentType Sheet translation logic
            const typeId = String(row.TypeID || row.GarmentType || "").trim();
            const resolvedGarmentType = typeMap[typeId] || row.GarmentType || typeId || "Jersey";

            return {
              id: idx + 1,
              sku: row.SKU || `AZ-PROD-${idx + 1}`,
              name: row["Product Name"] || row.ProductName || `Sublimated Garment ${idx + 1}`,
              sport: sportName,
              category: sportName,
              garmentType: resolvedGarmentType,
              description: row.Description || "Dye-sublimated custom activewear garment.",
              fabric: row.FabricID || row.Fabric || "Micro Interlock",
              gsm: row.GSM || "140 GSM",
              sizes: row.Sizes || "S, M, L, XL, 2XL, 3XL",
              colors: row.Colors || "Custom",
              images: [
                row["Image 1"] || row.Image1 || imgPool[idx % imgPool.length], 
                row["Image 2"] || row.Image2 || imgPool[(idx + 1) % imgPool.length]
              ]
            };
          });
          PRODUCTS = liveProducts;
          document.getElementById("liveSyncBadge").textContent = `⚡ LIVE SYNC ACTIVE (${PRODUCTS.length} ITEMS)`;
        }

        renderProducts(PRODUCTS);

        // Sync Builders
        if (sheetData?.fabrics?.length > 0) {
          document.getElementById("builderFabric").innerHTML = sheetData.fabrics.map(f => 
            `<option value="${f.FabricName || f.FabricID}">${f.FabricName || f.FabricID}</option>`
          ).join('');
        }
      } catch (err) {
        console.log("Using local fallback catalogue.");
      }
    }

    // 2. PRODUCT RENDERER
    function renderProducts(items) {
      const grid = document.getElementById('productsGrid');
      if (!items || items.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--color-gray-400); padding:3rem;">No products match your criteria.</div>`;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="product-card">
          <div class="product-img-wrap" onclick="openPDP('${p.sku}')" style="cursor:pointer;">
            <img class="product-img product-img-main" src="${p.images[0]}" alt="${p.name}" loading="lazy">
            <img class="product-img product-img-hover" src="${p.images[1]}" alt="${p.name}" loading="lazy">
          </div>
          <div class="product-info">
            <div class="product-meta" style="color: var(--color-gray-300);">
              <!-- Restored Garment Type Display -->
              <span><span class="text-gold">${p.sport}</span> &bull; <span style="color: white;">${p.garmentType}</span></span>
              <span>${p.gsm}</span>
            </div>
            <h3 class="product-title">${p.name}</h3>
            <div style="font-size: 0.8rem; color: var(--color-gray-400); margin-bottom: 1rem;">
              Fabric: ${p.fabric} <br> SKU: ${p.sku}
            </div>
            <select id="size-${p.sku}" class="product-select" style="padding: 0.5rem;">
              <option value="Mixed (S-3XL)">Mixed Sizes (S-3XL)</option>
              <option value="S">Small (S)</option>
              <option value="M">Medium (M)</option>
              <option value="L">Large (L)</option>
              <option value="XL">XL</option>
              <option value="2XL">2XL</option>
            </select>
            <div class="product-actions">
              <button class="btn btn-gold" style="padding: 0.75rem; font-size:0.85rem;" onclick="addToCart('${p.sku}')">+ ADD TO REQUISITION</button>
              <button class="btn btn-outline" style="padding: 0.75rem; font-size:0.85rem;" onclick="openPDP('${p.sku}')">VIEW DETAILS</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(target) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (target === 'ALL') {
        renderProducts(PRODUCTS);
        return;
      }
      
      const t = target.toLowerCase();
      const filtered = PRODUCTS.filter(p => {
        const sport = String(p.sport).toLowerCase();
        if (t === 'football') return sport.includes('football') || sport.includes('soccer');
        if (t === 'performance') return sport.includes('performance') || sport.includes('run') || sport.includes('gym');
        if (t === 'lifestyle') return sport.includes('lifestyle') || String(p.garmentType).toLowerCase().includes('hoodie');
        return sport.includes(t);
      });
      renderProducts(filtered);
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = PRODUCTS.filter(p => 
        p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.fabric.toLowerCase().includes(q) || String(p.garmentType).toLowerCase().includes(q)
      );
      renderProducts(filtered);
    }

    // 3. PRODUCT DETAIL MODAL (PDP)
    function openPDP(sku) {
      const p = PRODUCTS.find(item => item.sku === sku);
      if (!p) return;

      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
          <div>
            <img src="${p.images[0]}" style="width:100%; border-radius: 4px; margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.1);">
          </div>
          <div>
            <!-- Restored Garment Type Display -->
            <span class="section-eyebrow">${p.sport} &bull; <span style="color:white;">${p.garmentType}</span></span>
            <h2 style="font-size: 2rem; margin-bottom: 1rem; color: var(--color-white);">${p.name}</h2>
            <p class="text-gray" style="margin-bottom: 1.5rem;">${p.description}</p>
            
            <div style="background: var(--color-navy-light); padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 1.5rem;">
              <p style="margin-bottom:0.5rem; font-size:0.9rem;"><strong class="text-gold">SKU:</strong> ${p.sku}</p>
              <p style="margin-bottom:0.5rem; font-size:0.9rem;"><strong class="text-gold">Fabric:</strong> ${p.fabric}</p>
              <p style="margin-bottom:0.5rem; font-size:0.9rem;"><strong class="text-gold">Weight:</strong> ${p.gsm}</p>
              <p style="font-size:0.9rem;"><strong class="text-gold">Available:</strong> ${p.sizes}</p>
            </div>

            <select id="pdpSizeSelect" class="product-select">
              <option value="Mixed Sizes (S-3XL)">Mixed Size Breakdown (S-3XL)</option>
              <option value="S">Small (S)</option>
              <option value="M">Medium (M)</option>
              <option value="L">Large (L)</option>
              <option value="XL">Extra Large (XL)</option>
            </select>

            <button class="btn btn-gold" style="width:100%; margin-bottom: 1rem;" onclick="addToCart('${p.sku}', document.getElementById('pdpSizeSelect').value); closeModal();">ADD TO REQUISITION CART</button>
            <a href="https://wa.me/923250043448?text=Hello%20Azan%20Impex,%20inquiry%20for%20SKU:%20${p.sku}" target="_blank" class="btn btn-outline" style="width:100%; border-color:#25D366; color:#25D366;">INQUIRE ON WHATSAPP</a>
          </div>
        </div>
      `;
      document.getElementById('productModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    // 4. CART & QUOTATION SYSTEM
    let cart = [];

    function addToCart(sku, explicitSize = null) {
      const prod = PRODUCTS.find(p => p.sku === sku);
      if (!prod) return;
      
      const sizeSelect = document.getElementById(`size-${sku}`);
      const selectedSize = explicitSize || (sizeSelect ? sizeSelect.value : 'Mixed Sizes');

      const existing = cart.find(item => item.sku === sku && item.size === selectedSize);
      if (existing) {
        existing.qty += 10;
      } else {
        cart.push({ sku: prod.sku, name: prod.name, fabric: prod.fabric, size: selectedSize, qty: 25 });
      }

      updateCartUI();
      toggleCartDrawer(true);
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cartCount').textContent = cart.length;
      const container = document.getElementById('cartItemsContainer');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray" style="margin-top: 2rem;">Your requisition cart is empty. Add products to request a quotation.</p>`;
        return;
      }

      container.innerHTML = cart.map((item, index) => `
        <div style="background: var(--color-navy); border: 1px solid rgba(255,255,255,0.05); padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-family: var(--font-heading); color: var(--color-white); margin-bottom: 0.25rem;">${item.name}</div>
            <div style="font-size: 0.75rem; color: var(--color-gold); margin-bottom: 0.25rem;">SKU: ${item.sku} | ${item.fabric}</div>
            <div style="font-size: 0.8rem; color: var(--color-gray-300);">Size: ${item.size} <br> Qty: ${item.qty} pcs</div>
          </div>
          <button onclick="removeFromCart(${index})" style="background:none; border:none; color: #EF4444; font-size: 1.25rem; cursor:pointer;">✕</button>
        </div>
      `).join('');
    }

    function toggleCartDrawer(forceOpen = false) {
      const overlay = document.getElementById('cartOverlay');
      if(forceOpen) {
        document.body.classList.add('cart-active');
      } else {
        document.body.classList.toggle('cart-active');
      }
    }

    // 5. EXTERNAL COMMUNICATION (WHATSAPP & FORM)
    function sendCartToWhatsApp() {
      if (cart.length === 0) { alert('Your cart is empty.'); return; }
      let text = "Hello Azan Impex,\nI would like to request an official quote for the following items:\n\n";
      cart.forEach((item, i) => {
        text += `${i + 1}. SKU: ${item.sku} | ${item.name} | Size: ${item.size} | Qty: ${item.qty} pcs\n`;
      });
      window.open(`https://wa.me/923250043448?text=${encodeURIComponent(text)}`, '_blank');
    }

    function sendCustomBuilderWhatsApp() {
      const sport = document.getElementById('builderSport').value;
      const fabric = document.getElementById('builderFabric').value;
      const size = document.getElementById('builderSize').value;
      const qty = document.getElementById('builderQty').value;
      const text = `Hello Azan Impex,\nI need a custom manufacturing quote:\n- Sport: ${sport}\n- Fabric: ${fabric}\n- Ratio: ${size}\n- Quantity: ${qty} pcs`;
      window.open(`https://wa.me/923250043448?text=${encodeURIComponent(text)}`, '_blank');
    }

    // 6. ORDER SUBMISSION & DASHBOARD STATE
    let adminOrders = JSON.parse(localStorage.getItem('azan_orders')) || [];

    function handleInquirySubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitOrderBtn');
      btn.disabled = true;
      btn.textContent = 'SUBMITTING...';

      const name = document.getElementById('custName').value;
      const company = document.getElementById('custCompany').value || 'N/A';
      const email = document.getElementById('custEmail').value;
      const phone = document.getElementById('custPhone').value;
      const notes = document.getElementById('custNotes').value || 'No notes';
      
      const orderId = `AZ-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
      const now = new Date().toISOString().replace('T', ' ').substring(0, 16);
      const itemSummary = cart.length > 0 ? cart.map(c => `${c.qty}x ${c.sku}`).join(', ') : 'Custom Inquiry';

      // 1. Send to FormSubmit
      const fd = new FormData();
      fd.append("Order_ID", orderId);
      fd.append("Customer", name);
      fd.append("Company", company);
      fd.append("Email", email);
      fd.append("Phone", phone);
      fd.append("Items", itemSummary);
      fd.append("Notes", notes);
      fetch(`https://formsubmit.co/ajax/${OWNER_EMAIL}`, { method: "POST", body: fd }).catch(e=>console.log(e));

      // 2. Log to Google Sheets
      const payload = {
        orderId, date: now, name, company, email, phone, notes, items: itemSummary,
        itemsList: cart.map(c => ({ sku: c.sku, qty: c.qty, size: c.size }))
      };
      if (GOOGLE_SHEET_WEBHOOK_URL.includes("script.google.com")) {
        fetch(GOOGLE_SHEET_WEBHOOK_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(e=>console.log(e));
      }

      // 3. Local Admin State
      adminOrders.unshift({
        id: orderId, date: now, name: `${name} (${company})`, contact: `${email}\n${phone}`,
        items: itemSummary, status: 'New Request'
      });
      localStorage.setItem('azan_orders', JSON.stringify(adminOrders));

      // 4. Success UI
      document.getElementById('formStatus').innerHTML = `
        <span style="color:#10B981; font-weight:600;">✅ Requisition Submitted! Ticket: ${orderId}</span>
        <br><a href="https://wa.me/923250043448?text=I%20just%20submitted%20ticket%20${orderId}" target="_blank" style="color:var(--color-gold); text-decoration:underline; display:inline-block; margin-top:0.5rem;">Follow up on WhatsApp</a>
      `;
      
      document.getElementById('orderForm').reset();
      cart = [];
      updateCartUI();
      btn.disabled = false;
      btn.textContent = 'REQUEST QUOTATION →';
    }

    // 7. SECURE ADMIN REFACTOR
    function openAdminLoginModal() { document.getElementById('adminLoginModal').classList.add('active'); }
    function closeAdminLoginModal() { document.getElementById('adminLoginModal').classList.remove('active'); }

    async function authenticateAdmin() {
      const u = document.getElementById('adminUser').value;
      const p = document.getElementById('adminPass').value;
      const errorElem = document.getElementById('loginError');

      errorElem.textContent = "Authenticating securely...";
      
      try {
        setTimeout(() => {
          if (btoa(u+':'+p) === "d2FqaWQ6QXphbkltcGV4MjAyNg==") { 
            sessionStorage.setItem('azan_secure_token', 'validated_session');
            closeAdminLoginModal();
            showAdminPanel();
          } else {
            errorElem.textContent = "Invalid Backend Token/Credentials.";
          }
        }, 800);
      } catch (err) {
        errorElem.textContent = "Backend connection error.";
      }
    }

    function showAdminPanel() {
      document.getElementById('adminPanel').style.display = 'block';
      const tbody = document.getElementById('adminOrderTableBody');
      tbody.innerHTML = adminOrders.map(o => `
        <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
          <td style="padding: 1rem; color: var(--color-gold); font-family: var(--font-heading);">${o.id}</td>
          <td style="padding: 1rem; color: var(--color-gray-400);">${o.date}</td>
          <td style="padding: 1rem;">${o.name}<br><span style="font-size:0.8rem;color:var(--color-gray-500);">${o.contact}</span></td>
          <td style="padding: 1rem; color: var(--color-gray-300);">${o.items}</td>
          <td style="padding: 1rem;"><span style="background: var(--color-blue-accent); padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem;">${o.status}</span></td>
        </tr>
      `).join('');
    }

    function logoutAdmin() {
      sessionStorage.removeItem('azan_secure_token');
      document.getElementById('adminPanel').style.display = 'none';
    }

    function downloadOrdersCSV() {
      if (adminOrders.length === 0) return alert('No orders found.');
      let csv = "Ticket ID,Date,Customer,Contact,Items,Status\n";
      adminOrders.forEach(o => {
        csv += `"${o.id}","${o.date}","${o.name}","${o.contact.replace(/\n/g,' ')}","${o.items}","${o.status}"\n`;
      });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      link.download = `Azan_Orders_${new Date().toISOString().substring(0,10)}.csv`;
      link.click();
    }

    if (sessionStorage.getItem('azan_secure_token') === 'validated_session') {
      showAdminPanel();
    }

    // Boot
    renderProducts(PRODUCTS);
    loadLiveSheetData();

  </script>
